apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    namespace 'com.rd.pageindicatorview'
    compileSdk 34
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.0.0'
    implementation 'androidx.core:core:1.0.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
}

allprojects {
    tasks.withType(Javadoc).tap {
        configureEach {
            options.addStringOption('Xdoclint:none', '-quiet')
            options.addStringOption('encoding', 'UTF-8')
        }
    }
}

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/baseinc/android-PageIndicatorView")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
    publications {
        release(MavenPublication) {
            group = 'in.thebase'
            artifactId = 'android-pageindicatorview'
            version = '1.0.3'

            pom {
                name = 'android-pageindicatorview'
                description = 'Page indicator for android ViewPager'
                url = 'https://github.com/baseinc/android-PageIndicatorView'
                licenses {
                    license {
                        name = 'The Apache Software License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                scm {
                    connection = 'scm:git@github.com/baseinc/android-PageIndicatorView.git'
                    developerConnection = 'scm:git@github.com/baseinc/android-PageIndicatorView.git'
                    url = 'https://github.com/baseinc/android-PageIndicatorView'
                }
            }

            afterEvaluate {
                from components.release
            }
        }
    }
}
